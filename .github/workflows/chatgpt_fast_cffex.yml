name: ChatGPT Fast CFFEX Option History

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/free_data_export/fast_cffex.py'
      - '.github/workflows/chatgpt_fast_cffex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cffex-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/free_data_export/requirements.txt
      - run: pip install -r tools/free_data_export/requirements.txt
      - name: Download CFFEX option history
        env:
          OUTPUT_DIR: output
        run: python tools/free_data_export/fast_cffex.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cffex-option-history-fast
          path: output/
          if-no-files-found: warn
          retention-days: 7
