name: A-share disclosure export

on:
  workflow_dispatch:
  push:
    branches:
      - data/a-share-disclosure-export
    paths:
      - tools/a_share_disclosure/export_disclosures_fast.py
      - tools/a_share_disclosure/requirements.txt
      - .github/workflows/a-share-disclosure-export.yml

permissions:
  contents: write

concurrency:
  group: a-share-disclosure-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record run start
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'run_id': int(os.environ['RUN_ID']),
              'run_number': int(os.environ['RUN_NUMBER']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'status': 'running',
              'head_sha': os.environ['HEAD_SHA'],
              'artifact_name': 'A股定期报告披露事件_20150101_20260806',
              'output_exists': False,
              'output_size': 0,
          }
          Path('tools/a_share_disclosure/latest_run.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tools/a_share_disclosure/latest_run.json
          git commit -m "chore: record disclosure export run ${RUN_ID} start"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/a_share_disclosure/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/a_share_disclosure/requirements.txt

      - name: Export disclosure events
        run: |
          mkdir -p output
          python tools/a_share_disclosure/export_disclosures_fast.py \
            --start-date 2015-01-01 \
            --end-date 2026-08-06 \
            --output output/A股定期报告披露事件_20150101_20260806.xlsx \
            --sleep 0.35

      - name: Show output
        if: always()
        run: ls -lah output || true

      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A股定期报告披露事件_20150101_20260806
          path: output/*
          if-no-files-found: warn
          retention-days: 7

      - name: Record run finish
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          output = Path('output/A股定期报告披露事件_20150101_20260806.xlsx')
          payload = {
              'run_id': int(os.environ['RUN_ID']),
              'run_number': int(os.environ['RUN_NUMBER']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'status': os.environ['RUN_STATUS'],
              'head_sha': os.environ['HEAD_SHA'],
              'artifact_name': 'A股定期报告披露事件_20150101_20260806',
              'output_exists': output.exists(),
              'output_size': output.stat().st_size if output.exists() else 0,
          }
          Path('tools/a_share_disclosure/latest_run.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git add -- tools/a_share_disclosure/latest_run.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record disclosure export run ${RUN_ID} finish"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
