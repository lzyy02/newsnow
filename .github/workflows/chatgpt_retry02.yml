name: ChatGPT Shanghai Share Capital Retry

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/free_data_export/retry02_shanghai.py'
      - '.github/workflows/chatgpt_retry02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-share:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/free_data_export/requirements.txt
      - run: pip install -r tools/free_data_export/requirements.txt
      - name: Retry Shanghai shard ${{ matrix.shard }}
        env:
          OUTPUT_DIR: output
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 8
        run: timeout 90m python tools/free_data_export/retry02_shanghai.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanghai-share-${{ matrix.shard }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
